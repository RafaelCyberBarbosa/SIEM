<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroDay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%2305080f' d='M0 0h100v100H0z'/%3E%3Cpath d='M50 8 88 22v26c0 26-16 40-38 44C28 88 12 74 12 48V22Z' fill='none' stroke='%2325f4c8' stroke-width='6'/%3E%3Cpath d='M36 50l10 10 20-22' fill='none' stroke='%2325f4c8' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <canvas id="bg-fx"></canvas>
  <div class="scanline"></div>
  <form id="login-form" class="login-box">
    <div class="login-mark">
      <svg viewBox="0 0 100 100" class="shield-icon"><path d="M50 6 90 21v27c0 27-17 42-40 46C27 90 10 75 10 48V21Z" fill="none" stroke="currentColor" stroke-width="5"/><path d="M34 50l11 11 21-24" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>ZERO<span>DAY</span></h1>
    <p class="subtitle">SECURITY INFORMATION &amp; EVENT MANAGEMENT</p>
    <div class="field-line"><input type="text" id="login-username" placeholder="Utilizador" autocomplete="username" required></div>
    <div class="field-line"><input type="password" id="login-password" placeholder="Palavra-passe" autocomplete="current-password" required></div>
    <button type="submit"><span>Entrar</span></button>
    <div id="login-error" class="error-msg"></div>
    <div class="login-status"><span class="dot"></span> aguardando autenticação segura</div>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 100 100" class="shield-icon-sm"><path d="M50 6 90 21v27c0 27-17 42-40 46C27 90 10 75 10 48V21Z" fill="none" stroke="currentColor" stroke-width="6"/><path d="M34 50l11 11 21-24" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ZERO<b>DAY</b></span>
    </div>
    <nav>
      <a href="#/dashboard" data-route="dashboard"><i>◆</i>Dashboard</a>
      <a href="#/events" data-route="events"><i>▤</i>Eventos</a>
      <a href="#/alerts" data-route="alerts"><i>▲</i>Alertas</a>
      <a href="#/livetail" data-route="livetail"><i>◈</i>Live Tail</a>
      <a href="#/rules" data-route="rules"><i>◇</i>Regras</a>
      <a href="#/sources" data-route="sources"><i>⬡</i>Fontes</a>
      <a href="#/users" data-route="users" id="nav-users"><i>◉</i>Utilizadores</a>
    </nav>
    <div class="sidebar-footer">
      <div class="uptime"><span class="dot live"></span> sistema operacional</div>
      <div id="current-user"></div>
      <button id="logout-btn">Terminar sessão</button>
    </div>
  </aside>
  <main id="main-content" class="main-content"></main>
</div>

<div id="toast-container"></div>

<script src="/static/js/bg-effect.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
